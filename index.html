<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Formulaire de contact</title>
</head>
<body>

<form class="formulaire">
    <h1>Formulaire de contact</h1>

    <label>Votre pseudo*</label>
    <input type="text" required placeholder="Votre pseudo">

    <label>Votre mot de passe*</label>
    <input type="password" required placeholder="Votre mot de passe">

    <label>Votre e-mail*</label>
    <input type="email" required placeholder="Votre e-mail">

    <label>Objet du message*</label>
    <select required>
        <option value="">-- Choisissez une option --</option>
        <option value="question">J'ai une question</option>
        <option value="suggestion">Je fais une suggestion</option>
        <option value="probleme">Je rencontre un problème</option>
        <option value="autre">Autre</option>
    </select>

    <label>Votre message*</label>
    <textarea required placeholder="Votre message"></textarea>

    <label>Niveau d'urgence :</label>

    <div class="radio-group">
        <label>
            <input type="radio" name="urgence" value="urgent" required>
            Urgent
        </label>

        <label>
            <input type="radio" name="urgence" value="normal">
            Normal
        </label>

        <label>
            <input type="radio" name="urgence" value="lent">
            Lent
        </label>
    </div>

        <label class="checkbox">
            <input type="checkbox" required>
            J'ai lu et j'accepte la politique de confidentialité du site.
        </label>

        <button type="submit" class="btn-envoyer">Envoyer</button>
</form>

</body>
</html>
